<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<!-- Sem scripts inline: script-src 'self'. Se ativar a PLANILHA, mantenha docs.google.com e googleusercontent.com em connect-src.
     Vídeos podem vir de qualquer endereço https (media-src https:). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>CineNoite — Filmes online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="catalogo.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<header id="top">
<div class="bar-in">
<div class="left">
<button class="ib" id="menuBtn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
<button class="logo" id="logo" type="button" aria-label="CineNoite, início"><b>CINE</b><i>noite</i></button>
</div>
<div class="right">
<div class="sbox" id="sbox"><input id="q" type="search" placeholder="Buscar filme, diretor, gênero ou ano" aria-label="Buscar filme" autocomplete="off"></div>
<button class="ib" id="searchBtn" type="button" aria-label="Buscar" aria-expanded="false" aria-controls="sbox"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
<button class="ib" id="listBtn" type="button" aria-label="Minha lista"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
<div class="pwrap">
<button class="ib avatar" id="profileBtn" type="button" aria-label="Meus dados neste navegador" aria-haspopup="true" aria-expanded="false" aria-controls="profileMenu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="4"/><path d="M4 21c1-4.5 4.5-6 8-6s7 1.5 8 6"/></svg></button>
<div class="pmenu" id="profileMenu" hidden>
<p id="pinfo"></p>
<div role="menu" aria-label="Meus dados neste navegador">
<button type="button" role="menuitem" data-act="export">Exportar meus dados</button>
<button type="button" role="menuitem" data-act="import">Importar dados…</button>
<button type="button" role="menuitem" class="danger" data-act="clearProg">Limpar progresso</button>
<button type="button" role="menuitem" class="danger" data-act="clearList">Limpar minha lista</button>
<button type="button" role="menuitem" class="danger" data-act="clearAll">Limpar tudo</button>
</div>
</div>
</div>
</div>
</div>
</header>

<div class="scrim" id="scrim" data-dclose hidden></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Menu principal"></div>

<noscript><p class="empty">O CineNoite precisa de JavaScript para funcionar.</p></noscript>
<section class="hero" id="hero" aria-label="Filmes em destaque"></section>
<main id="rows"></main>
<section id="detail" aria-label="Detalhes do filme" hidden></section>

<footer>© 2026 CineNoite. Página de demonstração.</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
<div class="screen" id="screen">
<button class="big" id="big" type="button" tabindex="-1" aria-label="Reproduzir"></button>
<p class="status" id="status" role="status"></p>
<div class="subs" id="subs" aria-hidden="true"></div>
<div class="topbar" id="topbar">
<button class="back" id="close" type="button" aria-label="Voltar"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><span class="vsep" aria-hidden="true"></span><span class="badge" aria-hidden="true">CN</span>
</div>
<div class="ctl" id="ctl">
<div class="trow"><h2 id="mt"></h2><span class="time" id="time">-0:00</span></div>
<div class="track" id="track" role="slider" tabindex="0" aria-label="Posição do vídeo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
<div class="brow">
<div class="bl"><button class="btn" id="mf" type="button" aria-pressed="false"></button><button class="btn" id="mr" type="button" hidden>Recomeçar do início</button><div class="pseg" id="pseg" role="group" aria-label="Partes do filme" hidden><button type="button" data-pt="0" aria-pressed="true">Parte 1</button><button type="button" data-pt="1" aria-pressed="false">Parte 2</button></div></div>
<div class="bc">
<button class="ic" id="rew" type="button" aria-label="Voltar 10 segundos"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><text x="12" y="15.6" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text></svg></button>
<button class="ic" id="pp" type="button" aria-label="Reproduzir"></button>
<button class="ic" id="fwd" type="button" aria-label="Avançar 10 segundos"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/><text x="12" y="15.6" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text></svg></button>
</div>
<div class="br">
<button class="spd" id="subsz" type="button" hidden aria-label="Tamanho da legenda" title="Tamanho da legenda">Aa</button>
<button class="spd" id="qual" type="button" hidden aria-label="Qualidade do vídeo">1080p</button>
<button class="spd" id="spd" type="button" aria-label="Velocidade de reprodução">1×</button>
<button class="ic" id="mute" type="button" aria-label="Som" aria-pressed="false"></button>
<label class="cc" title="Legendas"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 8.5h8M8 12h5"/></svg><select id="subtitle" aria-label="Selecionar legenda" hidden><option value="-1">Legendas: desligadas</option></select></label>
<button class="ic" id="fs" type="button" aria-label="Tela cheia"></button>
</div>
</div>
</div>
</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

</body>
</html>
