<style>
:root{color-scheme:dark;--bg:#0f1015;--surface:#1a1b21;--line:#2c2d34;--muted:#9a9ca5;--accent:#fff;--accent-ink:#000;--pad:clamp(16px,3.75vw,60px);--cw:clamp(128px,14.4vw,230px);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:90px}
body{margin:0;background:#0f1015 linear-gradient(#000,#0f1015 900px) no-repeat;color:#fff;font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

#top{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(#000d,transparent);transition:background .25s}
#top.solid{background:#000e;backdrop-filter:blur(10px)}
.bar-in{display:flex;align-items:center;justify-content:space-between;height:80px;padding:0 var(--pad)}
.left,.right{display:flex;align-items:center;gap:14px}
.ib{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%;color:#fff;padding:0}
button.ib:hover{background:#ffffff1f}
.avatar{background:#2b2c33;width:40px;height:40px}
.logo{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:flex-start;line-height:.82;text-align:left}
.logo b{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.logo i{font-style:normal;font-size:1.25rem;font-weight:600;margin-left:1px}
.sbox{width:0;overflow:hidden;transition:width .25s}
.sbox:not(.open){visibility:hidden}
.sbox.open{width:min(260px,44vw)}
#q{width:100%;background:#ffffff1a;border:1px solid #ffffff40;border-radius:4px;padding:8px 12px}
#q::placeholder{color:var(--muted)}

.scrim{position:fixed;inset:0;z-index:40;background:#000a}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(320px,86vw);background:#0b0c10;border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 8px 24px;overflow:auto;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
.drawer.open{transform:none;visibility:visible}
.drawer h3{margin:22px 16px 6px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 16px;border-radius:4px;font-size:1.1rem;color:#c9cad0}
.nav:hover{background:#ffffff14;color:#fff}
.nav.on{color:#fff;font-weight:700;background:#ffffff1f}
.x2{display:block;margin:0 0 10px auto;width:40px;height:40px;border:0;background:none;font-size:1.6rem}

.poster,.screen{background:radial-gradient(circle at var(--x,70%) 30%,hsl(var(--h) 85% 68% / .8) 0,transparent 38%),linear-gradient(165deg,hsl(var(--h) 45% 32%),hsl(calc(var(--h) + 40) 40% 14%))}
.has-img{background:var(--img) center/cover no-repeat,radial-gradient(circle at var(--x,70%) 30%,hsl(var(--h) 85% 68% / .8) 0,transparent 38%),linear-gradient(165deg,hsl(var(--h) 45% 32%),hsl(calc(var(--h) + 40) 40% 14%))}

.hero{position:relative;isolation:isolate;overflow:hidden;min-height:min(84vh,780px);display:flex;align-items:flex-end;padding:100px var(--pad) 120px;background:linear-gradient(165deg,hsl(var(--h) 40% 22%),#000)}
.hero::before{content:"";position:absolute;inset:-40px;z-index:-3;background:var(--img) center/cover;filter:blur(36px) saturate(1.2);opacity:.55}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#000c 0,#0000 62%),linear-gradient(0deg,var(--bg) 0,transparent 38%)}
.hero-art{position:absolute;top:0;right:0;bottom:0;width:min(48%,700px);z-index:-2;background:var(--img) right 20%/cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.hero-body{max-width:540px;animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hero h1{margin:0 0 12px;font:700 clamp(2.4rem,6vw,4.4rem)/.95 Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.9rem}
.hero .meta{color:#e4e4e8}
.hero p{margin:10px 0 22px;font-size:1.05rem;color:#f1f1f3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.watch{height:52px;padding:0 28px 0 22px;border:0;border-radius:4px;background:#e6e6e8;color:#111;font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;gap:12px}
.watch:hover{background:#fff}
.plus{width:52px;height:52px;border:0;border-radius:4px;background:#3b3c42cc;color:#fff;display:grid;place-items:center}
.plus:hover{background:#55565d}
.plus[aria-pressed=true]{background:#fff;color:#000}
.dots{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;gap:16px}
.dot{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:#ffffff59}
.dot.on{background:#fff}

#rows{padding-bottom:20px}
#rows.pad{padding-top:100px}
.row{margin:0 0 34px}
.row h2{margin:0 var(--pad) 12px;font-size:1.1rem;font-weight:600}
.gh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 var(--pad) 18px}
.gh h2{margin:0;font-size:1.5rem}
.count{font-size:.9rem;font-weight:400;color:var(--muted);margin-left:10px}
#sortSel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.rail-wrap{position:relative}
.rail{display:flex;gap:clamp(10px,1.25vw,20px);overflow-x:auto;padding:0 var(--pad) 4px;scroll-snap-type:x proximity;scroll-padding-left:var(--pad);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.arr{position:absolute;top:0;bottom:4px;width:56px;z-index:4;border:0;color:#fff;font-size:2.4rem;opacity:0;transition:opacity .2s}
.arr.l{left:0;background:linear-gradient(90deg,#000c,transparent)}
.arr.r{right:0;background:linear-gradient(270deg,#000c,transparent)}
@media(hover:hover){.rail-wrap:hover .arr{opacity:1}}
@media(hover:none){.arr{display:none}}
.gridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:24px 18px;padding:0 var(--pad)}
.card{position:relative;flex:none;width:var(--cw);scroll-snap-align:start}
.gridv .card{width:auto}
.card>.open{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.poster{position:relative;aspect-ratio:2/3;border-radius:2px;padding:12px;display:flex;align-items:flex-end;font-weight:700;font-size:1.15rem;line-height:1.1}
.card>.open:hover .poster,.card>.open:focus-visible .poster{outline:3px solid #fff;outline-offset:-1px}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff40}
.prog i{display:block;height:100%;background:#fff}
.tag{position:absolute;top:0;left:0;background:#fff;color:#111;font-size:.78rem;font-weight:600;padding:3px 7px;border-radius:2px;pointer-events:none}
.kebab{position:absolute;top:6px;right:4px;width:30px;height:30px;border:0;background:none;color:#fff;display:grid;place-items:center;filter:drop-shadow(0 1px 2px #000)}
.pop{position:absolute;top:38px;right:6px;z-index:6;min-width:200px;background:#fff;border-radius:4px;box-shadow:0 8px 24px #000a}
.pop button{display:block;width:100%;padding:11px 14px;border:0;background:none;text-align:left;color:#111;font-size:.9rem;font-weight:600}
.pop button:hover{background:#eee}
.empty{text-align:center;color:var(--muted);padding:48px var(--pad)}
footer{margin:30px var(--pad) 0;padding:24px 0 32px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}

.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:4px;padding:6px 10px;font-weight:600;font-size:.95rem;background:none;color:#cfcfd4}
.btn:hover{color:#fff}
.btn[aria-pressed=true] .heart path{fill:currentColor}
.modal{position:fixed;inset:0;z-index:50;display:none;background:#000}
.modal.open{display:block}
.dlg{position:absolute;inset:0;background:#000}
.screen{position:absolute;inset:0;overflow:hidden;background:#000;display:grid;place-items:center;touch-action:manipulation}
.screen video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
.screen video::cue{font-size:180%;line-height:1.25;background-color:rgba(0,0,0,.78);color:#fff;text-shadow:0 1px 3px #000}
.screen:fullscreen video::cue{font-size:200%}
.screen video::-webkit-media-text-track-container{transform:translateY(-16px)}
.big{width:84px;height:84px;border:0;border-radius:50%;background:#ffffff26;backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;z-index:2;transition:opacity .25s ease}
.big svg{width:36px;height:36px}
.screen.playing .big{opacity:0;pointer-events:none}
.status{position:absolute;left:var(--pad);right:var(--pad);top:92px;z-index:4;margin:0;padding:8px 12px;border-radius:6px;background:#000000cc;color:#fff;font-size:.85rem;pointer-events:none;width:fit-content;max-width:calc(100% - 2*var(--pad))}
.status:empty{display:none}
.status a{color:#fff;text-decoration:underline;pointer-events:auto}

.topbar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:14px;height:100px;padding:env(safe-area-inset-top,0px) var(--pad) 0;background:linear-gradient(#000b,transparent);transition:opacity .25s}
.back{width:44px;height:44px;border:0;background:none;color:#fff;display:grid;place-items:center;padding:0}
.vsep{width:1px;height:56px;background:#ffffff59}
.badge{background:#fff;color:#000;font-weight:800;border-radius:6px;padding:1px 9px;font-size:1.3rem;letter-spacing:-.02em;line-height:1.35}

.ctl{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:70px var(--pad) calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000d);transition:opacity .25s ease}
.screen.controls-hidden .ctl,.screen.controls-hidden .topbar{opacity:0;pointer-events:none}
.screen.controls-hidden .big{opacity:0!important;pointer-events:none}
.screen.controls-hidden{cursor:none}
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.trow h2{margin:0;font-size:1.45rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{position:relative;height:3px;margin:14px 0 12px;background:#5b5b5b;cursor:pointer;touch-action:none}
.track::after{content:"";position:absolute;inset:-14px 0}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:#fff;pointer-events:none}
.fill::after{content:"";position:absolute;right:-8px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff}
.brow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.bl{display:flex;flex-wrap:wrap;gap:4px}
.bc{display:flex;align-items:center;gap:38px}
.br{display:flex;justify-content:flex-end;align-items:center;gap:22px}
.ic{border:0;background:none;color:#fff;padding:4px;display:grid;place-items:center}
.ic:hover{opacity:.8}
.spd{font-size:.82rem;font-weight:600;padding:3px 8px;border:1px solid #ffffff59;border-radius:4px;background:none;color:#fff}
.cc{position:relative;width:34px;height:34px;display:grid;place-items:center;color:#fff}
.cc:has(#subtitle[hidden]){display:none}
.cc select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.info{display:none}

.subs{position:absolute;left:50%;transform:translateX(-50%);bottom:7%;z-index:2;width:min(92%,1100px);text-align:center;pointer-events:none;font-weight:600;line-height:1.4;color:#fff;font-size:calc(var(--subsz,1)*clamp(16px,3vh,40px));transition:bottom .25s}
.screen:not(.controls-hidden) .subs{bottom:190px}
.subs .sl{background:#000c;padding:.05em .45em;border-radius:3px;white-space:pre-line;box-decoration-break:clone;-webkit-box-decoration-break:clone;text-shadow:0 1px 2px #000}
@media(max-width:700px){
.hero{min-height:78vh;padding-bottom:110px}
.hero-art{width:100%;opacity:.55;-webkit-mask-image:linear-gradient(0deg,transparent,#000 60%);mask-image:linear-gradient(0deg,transparent,#000 60%)}
.dots{bottom:56px}
.topbar{height:76px;padding-left:12px;padding-right:12px}
.status{top:80px}
.screen:not(.controls-hidden) .subs{bottom:210px}
.ctl{padding:40px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.trow h2{font-size:1.15rem}
.brow{grid-template-columns:1fr auto}
.bc{grid-column:1/-1;order:-1;justify-content:center;gap:34px;margin-bottom:4px}
.br{gap:14px}
.bl .btn{font-size:.82rem;padding:6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

let hi=0,heroTimer=null;
const FEAT=()=>M.slice(0,6);

function renderHero(){
  const hero=$("#hero");
  const grid=filter!=="Todos"||q;
  hero.hidden=!!grid;
  if(grid)return;
  const L=FEAT(),n=hi%L.length,o=L[n],f=favs.has(o.id);
  hero.style.cssText=sty(o);
  hero.innerHTML='<div class="hero-art"></div><div class="hero-body"><h1>'+esc(o.t)+'</h1><div class="meta">'+meta(o)+'</div><p>'+esc(o.p)+'</p><div class="actions"><button class="watch" data-open="'+o.id+'">'+ICON.play.replace(/26/g,"22")+(inProgress(o)?'Continuar':'Assistir')+'</button><button class="plus" data-fav="'+o.id+'" aria-pressed="'+f+'" aria-label="'+(f?'Remover da minha lista':'Adicionar à minha lista')+'">'+(f?IC.check:IC.plus)+'</button></div></div><div class="dots">'+L.map((_,i)=>'<button class="dot'+(i===n?' on':'')+'" data-dot="'+i+'" aria-label="Destaque '+(i+1)+'"></button>').join("")+'</div>';
}

function startHero(){
  clearInterval(heroTimer);
  heroTimer=setInterval(()=>{
    if(document.hidden||$("#hero").hidden||$("#modal").classList.contains("open"))return;
    hi=(hi+1)%FEAT().length;
    renderHero();
  },8000);
}

function cardHTML(o){
  const p=pct(o),ip=inProgress(o),w=p>=.95,inList=favs.has(o.id);
  const tag=ip?"Continuar":w?"Assistido":"";
  return '<article class="card"><button class="open" data-open="'+o.id+'" aria-label="Abrir '+esc(o.t)+'"><div class="poster'+(o.img?' has-img':'')+'" style="'+esc(sty(o))+'">'+(o.img?'':'<b>'+esc(o.t)+'</b>')+(ip?'<span class="prog"><i style="width:'+Math.round(p*100)+'%"></i></span>':'')+'</div></button>'+(tag?'<span class="tag">'+tag+'</span>':'')+'<button class="kebab" data-kb="'+o.id+'" aria-label="Opções: '+esc(o.t)+'" aria-haspopup="true">'+IC.dots+'</button><div class="pop" hidden><button data-fav="'+o.id+'">'+(inList?'Remover da minha lista':'Adicionar à minha lista')+'</button>'+((ip||w)?'<button data-clear="'+o.id+'">'+(ip?'Remover de Continuar assistindo':'Marcar como não assistido')+'</button>':'')+'</div></article>';
}

function railHTML(k,title,L){
  return '<section class="row"><h2>'+esc(title)+'</h2><div class="rail-wrap"><button class="arr l" data-arr="-1" aria-label="Anteriores">‹</button><div class="rail" data-k="'+esc(k)+'">'+L.map(cardHTML).join("")+'</div><button class="arr r" data-arr="1" aria-label="Próximos">›</button></div></section>';
}

function visible(){
  const L=M.filter(o=>(
    filter==="Todos" ||
    (filter==="Minha lista" ? favs.has(o.id) :
      filter.startsWith("Década de ") ? decadeOf(o)===filter : o.g===filter)
  )&&norm(o.t+" "+o.g+" "+o.y).includes(norm(q)));
  if(SORTS[sortBy])L.sort(SORTS[sortBy]);
  return L;
}

function renderRows(){
  const R=$("#rows"),sc={};
  R.querySelectorAll(".rail").forEach(r=>{sc[r.dataset.k]=r.scrollLeft});
  const grid=filter!=="Todos"||q;
  R.className=grid?"pad":"";
  let h="";
  if(grid){
    const L=visible();
    const opts=[["","Ordem padrão"],["az","A–Z"],["new","Mais recentes"],["old","Mais antigos"],["short","Mais curtos"]]
      .map(([v,l])=>'<option value="'+v+'"'+(v===sortBy?' selected':'')+'>'+l+'</option>').join("");
    const vazio=filter==="Minha lista"&&!q?"Sua lista está vazia. Use o menu ⋮ de um filme para adicioná-lo aqui.":"Nenhum filme encontrado. Tente outro nome ou escolha outra categoria.";
    h='<section class="row"><div class="gh"><h2>'+esc(q?"Resultados para “"+q+"”":filter)+'<span class="count">'+L.length+(L.length===1?" filme":" filmes")+'</span></h2><select id="sortSel" aria-label="Ordenar filmes">'+opts+'</select></div>'+
      (L.length?'<div class="gridv">'+L.map(cardHTML).join("")+'</div>':'<p class="empty">'+vazio+'</p>')+'</section>';
  }else{
    const rows=[];
    const cont=M.filter(inProgress).sort((a,b)=>prog[b.t].u-prog[a.t].u);
    if(cont.length)rows.push(["cont","Continuar assistindo",cont]);
    const mine=M.filter(o=>favs.has(o.id));
    if(mine.length)rows.push(["mine","Minha lista",mine]);
    rows.push(["rec","Recomendados para você",M]);
    const byG={};
    M.forEach(o=>{if(o.g)(byG[o.g]=byG[o.g]||[]).push(o)});
    Object.entries(byG).filter(([,l])=>l.length>1).sort((a,b)=>b[1].length-a[1].length).forEach(([g,l])=>rows.push(["g:"+g,g,l]));
    const curtos=M.filter(o=>o.m<=90);
    if(curtos.length>1)rows.push(["curtos","Filmes curtos (até 1h30)",curtos]);
    const dec={};
    M.forEach(o=>{const d=decadeOf(o);if(d)(dec[d]=dec[d]||[]).push(o)});
    Object.keys(dec).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]).forEach(d=>{if(dec[d].length>1)rows.push(["d:"+d,d,dec[d]])});
    h=rows.map(r=>railHTML(r[0],r[1],r[2])).join("");
  }
  R.innerHTML=h;
  R.querySelectorAll(".rail").forEach(r=>{if(sc[r.dataset.k])r.scrollLeft=sc[r.dataset.k]});
}

function renderDrawer(){
  const genres=[...new Set(M.map(o=>o.g).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt"));
  const decades=[...new Set(M.map(decadeOf).filter(Boolean))].sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);
  const item=(c,l)=>'<button class="nav'+(c===filter&&!q?' on':'')+'" data-c="'+esc(c)+'">'+esc(l||c)+'</button>';
  $("#drawer").innerHTML='<button class="x2" data-dclose aria-label="Fechar menu">×</button>'+item("Todos","Início")+item("Minha lista")+'<button class="nav" data-rand>Sortear um filme</button><h3>Gêneros</h3>'+genres.map(g=>item(g)).join("")+'<h3>Décadas</h3>'+decades.map(d=>item(d)).join("");
}

function renderAll(){renderDrawer();renderHero();renderRows()}

document.addEventListener("click",e=>{
  const t=e.target;
  const c=t.closest("[data-c]"),o=t.closest("[data-open]"),f=t.closest("[data-fav]");
  const kb=t.closest("[data-kb]"),ar=t.closest("[data-arr]"),dt=t.closest("[data-dot]");

const fmt=s=>{
  s=Math.floor(s||0);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=String(s%60).padStart(2,"0");
  return h?h+":"+String(m).padStart(2,"0")+":"+r:m+":"+r;
};

function ui(){
  // Enquanto o seek está em andamento, não deixe timeupdate restaurar
  // visualmente a posição antiga do vídeo.
  if(vid&&!isSeeking&&pendingSeekTime===null&&Number.isFinite(vid.duration)&&vid.duration>0){
    pos=vid.currentTime/vid.duration;
  }

  $("#fill").style.width=(pos*100)+"%";

  const total=vid&&Number.isFinite(vid.duration)?vid.duration:cur.m*60;
  $("#time").textContent="-"+fmt(total-pos*total);
  $("#mute").innerHTML=vid&&vid.muted?CP.mute:CP.vol;
  $("#fs").innerHTML=CP.fs;

  const ic=playing?ICON.pause:ICON.play;
  $("#big").innerHTML=ic;
  $("#pp").innerHTML=playing?CP.pause:CP.play;
  $("#screen").classList.toggle("playing",playing);
}

// Mostra, em cima do vídeo, por que ele não carregou (código + servidor).
function mostrarErro(v){
  const code=v.error&&v.error.code;
  const detalhe=code===2?"A conexão foi interrompida.":
    code===3?"O navegador não conseguiu decodificar este arquivo (formato ou codec).":
    code===4?"Não achei o vídeo neste endereço, ele está bloqueado ou o formato não é compatível.":
    "O servidor não conseguiu entregar o vídeo.";
  const link=v.currentSrc||v.src||"";
  let host="";
  try{host=new URL(link).hostname}catch(e){}
  $("#status").innerHTML=esc(detalhe)+" (código "+esc(code||"?")+(host?", servidor "+esc(host):"")+")"+
    (/^https?:/i.test(link)?' <a href="'+esc(link)+'" target="_blank" rel="noopener">Abrir o vídeo direto</a>':"");
  console.warn("Erro no vídeo:",cur&&cur.t,"código",code,link);
}

function setPlay(on){
  if(!vid)return;

  if(on){
    const player=vid;
    const p=player.play();
    if(p&&p.catch)p.catch(error=>{
      if(vid!==player)return;
      if(player.error)mostrarErro(player);
      else $("#status").textContent="Não foi possível iniciar a reprodução. Toque em Reproduzir para tentar novamente.";
      console.warn("Falha ao iniciar reprodução:",error);
    });
  }else{
    vid.pause();
  }
}

let subTrack=null;
function renderSubs(){
  const box=$("#subs");
  box.textContent="";
  if(!subTrack)return;
  Array.from(subTrack.activeCues||[]).forEach(c=>{
    const d=document.createElement("div"),sp=document.createElement("span");
    sp.className="sl";
    sp.appendChild(c.getCueAsHTML?c.getCueAsHTML():document.createTextNode(c.text));
    d.appendChild(sp);
    box.appendChild(d);
  });
}
// Legenda desenhada pelo site: "hidden" carrega o arquivo, mas não deixa o navegador desenhar.
function useSub(i){
  if(subTrack)subTrack.oncuechange=null;
  subTrack=null;
  if(vid){
    const trs=Array.from(vid.querySelectorAll("track")).map(t=>t.track);
    trs.forEach((t,k)=>{t.mode=k===i?"hidden":"disabled"});
    if(i>=0&&trs[i]){subTrack=trs[i];subTrack.oncuechange=renderSubs}
  }
  renderSubs();
}

function skip(s){
  if(!vid||!Number.isFinite(vid.duration))return;
  vid.currentTime=Math.max(0,Math.min(vid.duration,vid.currentTime+s));
}

function fillFav(){
  const f=favs.has(cur.id);
  $("#mf").setAttribute("aria-pressed",f);
  $("#mf").innerHTML=ICON.heart+(f?"Na minha lista":"Minha lista");
}

function toggleFs(){
  const el=$("#screen");

  if(document.fullscreenElement){
    document.exitFullscreen();
  }else if(el.requestFullscreen){
    el.requestFullscreen();
  }else if(vid&&vid.webkitEnterFullscreen){
    // iPhone: só o player nativo entra em tela cheia.
    const tk=subTrack;
    if(tk){tk.mode="showing";vid.addEventListener("webkitendfullscreen",()=>{if(subTrack===tk)tk.mode="hidden"},{once:true})}
    vid.webkitEnterFullscreen();
  }
}

function openMovie(o){
  cur=o;
  pos=0;
  playing=false;
  isSeeking=false;
  pendingSeekTime=null;
  seekPointerId=null;
  keepControlsVisible();
  lastFocus=document.activeElement;

  const s=$("#screen");
  s.setAttribute("style",sty(o));
  // Desconecta completamente o player anterior antes de criar outro.
  s.querySelectorAll("video").forEach(v=>{
    v.pause();
    v.removeAttribute("src");
    v.querySelectorAll("source,track").forEach(el=>el.remove());
    try{v.load()}catch(e){}
    v.remove();
  });
  vid=null;

  $("#status").textContent="";
  $("#spd").textContent="1×";
  useSub(-1);
  $("#subtitle").hidden=$("#subsz").hidden=true;
  $("#subtitle").innerHTML='<option value="-1">Legendas: desligadas</option>';

  // Arquivo direto (src, com token se for do seu PC) ou vídeo do Drive via Render.
  const url=o.src?mediaUrl(o.src):(o.driveId&&MEDIA_OK?MEDIA+"/media/"+encodeURIComponent(o.driveId):"");

  // Retoma de onde você parou (3 s antes, para recuperar o contexto).
  const sp=prog[o.t];
  const startAt=sp&&inProgress(o)?Math.max(0,sp.t-3):0;
  $("#mr").hidden=!startAt;
  lastSave=Date.now();
  let initSub=-1;

  if(url){
    const v=document.createElement("video");
    v.src=url;
    v.playsInline=true;
    v.setAttribute("playsinline","");
    v.setAttribute("webkit-playsinline","");
    v.preload="metadata";
    v.controls=false;

    (o.subtitles||[]).forEach((sub,i)=>{
      const tr=document.createElement("track");
      tr.kind="subtitles";
      tr.src=sub.src;
      tr.srclang=sub.lang||"pt";
      tr.label=sub.label||sub.lang||"Legenda";

      v.appendChild(tr);

      const op=document.createElement("option");
      op.value=String(i);
      op.textContent=sub.label||"Legenda";
      $("#subtitle").appendChild(op);
    });

    if((o.subtitles||[]).length){
      $("#subtitle").hidden=$("#subsz").hidden=false;
      const def=(o.subtitles||[]).findIndex((x,i)=>x.default||(i===0&&subPref()));
      if(def>=0){$("#subtitle").value=String(def);initSub=def}
    }

    v.addEventListener("play",()=>{
      if(vid!==v)return;
      playing=true;
      ui();
      showControls();
    });

    v.addEventListener("pause",()=>{
      if(vid!==v)return;
      playing=false;
      saveNow();
      ui();
      keepControlsVisible();
    });

    v.addEventListener("timeupdate",()=>{
      ui();
      if(vid===v&&playing&&Date.now()-lastSave>5000){
        lastSave=Date.now();
        saveNow();
      }
    });
    v.addEventListener("seeking",()=>{
      if(pendingSeekTime!==null)ui();
    });
    v.addEventListener("seeked",()=>{
      pendingSeekTime=null;
      ui();
    });
    v.addEventListener("durationchange",ui);

    v.addEventListener("loadedmetadata",()=>{
      if(vid!==v)return;
      $("#status").textContent="";
      if(startAt>0){
        try{v.currentTime=startAt}catch(e){}
        $("#status").textContent="Retomando de "+fmt(startAt)+"…";
      }
      ui();
    });

    v.addEventListener("error",()=>{
      if(vid!==v)return;
      mostrarErro(v);
    });

    v.addEventListener("waiting",()=>{
      if(vid===v)$("#status").textContent="Carregando vídeo…";
    });
    v.addEventListener("playing",()=>{
      if(vid===v)$("#status").textContent="";
    });
    v.addEventListener("canplay",()=>{
      if(vid===v&&v.paused)$("#status").textContent="Pronto para reproduzir.";
    });

    v.addEventListener("stalled",()=>{
      if(vid===v&&pendingSeekTime!==null){
        $("#status").textContent="Aguardando o servidor entregar o trecho solicitado...";
      }
    });

    v.addEventListener("volumechange",ui);
    v.addEventListener("ratechange",()=>{
      if(vid===v)$("#spd").textContent=(+v.playbackRate.toFixed(2))+"×";
    });

    // Um toque pausa/continua; dois toques: laterais pulam 10 s, centro abre tela cheia.
    let clickTimer=null;
    v.addEventListener("click",()=>{
      clearTimeout(clickTimer);
      clickTimer=setTimeout(()=>setPlay(v.paused),220);
    });
    v.addEventListener("dblclick",e=>{
      clearTimeout(clickTimer);
      const r=v.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width;
      showControls();
      if(x<.33)skip(-10);
      else if(x>.67)skip(10);
      else toggleFs();
    });

    s.prepend(v);
    vid=v;
    useSub(initSub);
  }else{
    $("#status").textContent=o.driveId&&!MEDIA_OK
      ?"Este filme depende do servidor do Drive, que não está configurado."
      :"Este filme ainda não está disponível.";
  }

  $("#mt").textContent=o.t;
  $("#mm").innerHTML=meta(o);
  $("#ms").textContent=o.p;
  fillFav();
  ui();

  $("#modal").classList.add("open");
  $("#close").focus();
}

function closeMovie(){
  keepControlsVisible();
  saveNow();

  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});

  const old=vid;
  vid=null;
  useSub(-1);
  playing=false;
  isSeeking=false;
  pendingSeekTime=null;
  seekPointerId=null;

  if(old){
    old.pause();
    old.removeAttribute("src");
    old.querySelectorAll("source,track").forEach(el=>el.remove());
    try{old.load()}catch(e){}
    old.remove();
  }

  $("#modal").classList.remove("open");

  // Atualiza barras de progresso e "Continuar assistindo".
  renderAll();
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
  else if(cur){
    const b=document.querySelector('[data-open="'+cur.id+'"]');
    if(b)b.focus();
  }
}

// Converte a posição horizontal do ponteiro em uma fração de 0 a 1.
function getSeekFraction(e){
  const rect=$("#track").getBoundingClientRect();

  if(!rect.width)return null;

  const fraction=(e.clientX-rect.left)/rect.width;
  return Math.min(1,Math.max(0,fraction));
}

// Durante o arraste, atualiza a prévia visual sem disparar vários seeks.
function previewSeek(fraction){
  if(!vid||!Number.isFinite(vid.duration)||vid.duration<=0)return;

  pos=fraction;
  $("#fill").style.width=(fraction*100)+"%";
  $("#time").textContent="-"+fmt(vid.duration*(1-fraction));
}

// Aplica o seek real quando o usuário solta a barra.
function commitSeek(fraction){
  if(!vid||!Number.isFinite(vid.duration)||vid.duration<=0)return;

  const duration=vid.duration;
  const targetTime=Math.max(0,Math.min(duration,fraction*duration));

  pendingSeekTime=targetTime;
  pos=targetTime/duration;
  $("#fill").style.width=(pos*100)+"%";
  $("#time").textContent="-"+fmt(duration-targetTime);
  $("#status").textContent="";

  try{
    vid.currentTime=targetTime;

    if(Math.abs(vid.currentTime-targetTime)<0.05&&!vid.seeking){
      pendingSeekTime=null;
      ui();
    }
  }catch(error){
    pendingSeekTime=null;
    $("#status").textContent="Não foi possível avançar para esse ponto.";
    console.error("Erro ao posicionar o vídeo:",error);
    ui();
  }
}

// Mouse, toque e caneta: clique e arraste na timeline.
$("#track").addEventListener("pointerdown",e=>{
  if(!vid||!Number.isFinite(vid.duration)||vid.duration<=0)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;

  e.preventDefault();
  showControls();

  isSeeking=true;
  seekPointerId=e.pointerId;

  const fraction=getSeekFraction(e);
  if(fraction!==null)previewSeek(fraction);

  try{
    e.currentTarget.setPointerCapture(e.pointerId);
  }catch(error){}
});

$("#track").addEventListener("pointermove",e=>{
  if(!isSeeking||e.pointerId!==seekPointerId)return;

  const fraction=getSeekFraction(e);
  if(fraction!==null)previewSeek(fraction);
});

$("#track").addEventListener("pointerup",e=>{
  if(!isSeeking||e.pointerId!==seekPointerId)return;

  const fraction=getSeekFraction(e);

  if(fraction!==null){
    previewSeek(fraction);
  }

  isSeeking=false;
  if(fraction!==null)commitSeek(fraction);
  seekPointerId=null;
  showControls();

  try{
    if(e.currentTarget.hasPointerCapture(e.pointerId)){
      e.currentTarget.releasePointerCapture(e.pointerId);
    }
  }catch(error){}
});

$("#track").addEventListener("pointercancel",()=>{
  isSeeking=false;
  seekPointerId=null;
  if(pendingSeekTime===null)ui();
});

$("#screen").addEventListener("pointermove",showControls);
$("#screen").addEventListener("pointerdown",showControls);

$("#screen").addEventListener("pointerleave",()=>{
  if(vid&&!vid.paused&&!vid.ended&&!isSeeking){
    clearTimeout(controlsTimer);

    controlsTimer=setTimeout(()=>{
      $("#screen").classList.add("controls-hidden");
    },CONTROLS_DELAY);
  }
});

$("#big").onclick=$("#pp").onclick=()=>{
  showControls();
  setPlay(!playing);
};

$("#subtitle").addEventListener("change",()=>{
  if(!vid)return;

  const selected=Number($("#subtitle").value);
  try{localStorage.setItem("cn-sub",selected>=0?"1":"0")}catch(e){}

  useSub(selected);
});

const SUBSZ=[["Pequena",.75],["Média",1],["Grande",1.35],["Extra grande",1.8]];
let szi=1;
try{const raw=localStorage.getItem("cn-subsz");if(raw!==null&&SUBSZ[+raw])szi=+raw}catch(e){}
const applySz=()=>document.documentElement.style.setProperty("--subsz",SUBSZ[szi][1]);
applySz();
$("#subsz").onclick=()=>{
  showControls();
  szi=(szi+1)%SUBSZ.length;
  applySz();
  try{localStorage.setItem("cn-subsz",szi)}catch(e){}
  $("#status").textContent="Tamanho da legenda: "+SUBSZ[szi][0];
  setTimeout(()=>{if($("#status").textContent.startsWith("Tamanho"))$("#status").textContent=""},1500);
};

$("#spd").onclick=()=>{
  showControls();
  if(!vid)return;
  const i=SPEEDS.indexOf(vid.playbackRate);
  vid.playbackRate=SPEEDS[(i+1)%SPEEDS.length];
};

$("#rew").onclick=()=>{showControls();skip(-10)};
$("#fwd").onclick=()=>{showControls();skip(10)};
$("#mf").onclick=()=>cur&&toggleFav(cur.id);

$("#mr").onclick=()=>{
  if(!vid||!cur)return;
  delete prog[cur.t];
  saveProg();
  vid.currentTime=0;
  $("#mr").hidden=true;
  setPlay(true);
};

$("#mute").onclick=()=>{

};

$("#fs").onclick=()=>{

};

$("#close").onclick=closeMovie;

$("#modal").addEventListener("click",e=>{
  if(e.target.id==="modal")closeMovie();
});

// Teclado: Esc fecha; Espaço/K pausa; setas pulam 10 s; ↑↓ volume; M som; F tela cheia.
document.addEventListener("keydown",e=>{
  if(!$("#modal").classList.contains("open"))return;

  if(e.key==="Escape"){closeMovie();return}
  if(!vid||e.ctrlKey||e.metaKey||e.altKey)return;

  const tag=e.target.tagName;
  if(tag==="SELECT"||tag==="INPUT")return;

  const k=e.key.toLowerCase();

  if(k==="k"||(k===" "&&tag!=="BUTTON")){
    e.preventDefault();
    showControls();
    setPlay(vid.paused);
  }else if(k==="arrowleft"||k==="arrowright"){
    e.preventDefault();
    showControls();
    skip(k==="arrowright"?10:-10);
  }else if(k==="arrowup"||k==="arrowdown"){
    e.preventDefault();
    showControls();
    vid.volume=Math.max(0,Math.min(1,vid.volume+(k==="arrowup"?.1:-.1)));
  }else if(k==="m"){
    showControls();
    vid.muted=!vid.muted;
  }else if(k==="f"){
    showControls();
    toggleFs();
  }
});

/* ===== Lista de filmes pela planilha do Google ===== */
const driveId=u=>{u=String(u||"").trim();const m=u.match(/\/d\/([-\w]+)|[?&]id=([-\w]+)/);return m?(m[1]||m[2]):u};
const hueOf=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};

function parseCSV(t){
  t=t.replace(/^\uFEFF/,"");
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){
      if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}
      else c+=ch;
    }else if(ch==='"')q=true;
    else if(ch===","){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}
    else c+=ch;
  }
  if(c!==""||r.length){r.push(c);rows.push(r)}
  return rows;
}

function filmesDaPlanilha(csv){
  const rows=parseCSV(csv).filter(r=>r.some(c=>c.trim()));
  if(rows.length<2)return [];
  const head=rows[0].map(c=>norm(c.trim()));
  const col=(r,n)=>{const i=head.indexOf(n);return i<0?"":(r[i]||"").trim()};
  return rows.slice(1).map(r=>{
    const t=col(r,"titulo");
    if(!t)return null;
    const cor=col(r,"cor");
    const o={
      t,
      g:col(r,"genero")||"Drama",
      y:+col(r,"ano")||"",
      m:+col(r,"minutos")||100,
      a:col(r,"idade")||"12",
      h:cor!==""&&!isNaN(+cor)?+cor:hueOf(t),
      x:(20+hueOf(t+"x")%60)+"%",
      p:col(r,"sinopse")
    };
    const capa=col(r,"capa"),leg=col(r,"legenda"),dr=col(r,"drive"),vd=col(r,"video");
    if(capa)o.img=/^https?:/.test(capa)?capa:CAPAS+capa;
    if(dr)o.driveId=driveId(dr);
    if(vd)o.src=/^https:\/\//.test(vd)?vd:"https://"+TS_HOST+"/"+encodeURIComponent(vd);
    if(leg)o.subtitles=[{src:/^https?:/.test(leg)?leg:"legendas/"+leg,lang:"pt-BR",label:"Português"}];
    return o;
  }).filter(Boolean);
}

async function carregarPlanilha(){
  if(!PLANILHA)return;
  try{
    // Aceita o link "pubhtml" e converte para CSV automaticamente.
    let url=PLANILHA.replace("/pubhtml","/pub");
    if(!/output=csv/.test(url))url+=(url.includes("?")?"&":"?")+"output=csv";

    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);

    const lista=filmesDaPlanilha(await r.text());
    if(!lista.length){
      console.warn("A planilha foi lida, mas não tem filmes válidos (confira a linha de títulos das colunas). Usando a lista padrão.");
      return;
    }

    lista.forEach((o,i)=>{o.id=i;o.src=o.src||""});
    M.splice(0,M.length,...lista);
    renderAll();
    console.info("Planilha carregada:",lista.length,"filmes.");
  }catch(e){
    console.warn("Não foi possível ler a planilha; usando a lista padrão.",e);
  }
}

renderAll();
startHero();
carregarPlanilha();
