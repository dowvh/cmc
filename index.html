<style>
:root{color-scheme:dark;--bg:#26282c;--surface:#303338;--surface-2:#3a3e44;--line:#464b53;--text:#f3f3f1;--muted:#a6abb3;--accent:#f4b942;--accent-ink:#2a2208;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(38,40,44,.92);backdrop-filter:blur(12px);z-index:10}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(38,40,44,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.35rem}
.dots{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:11px 0 var(--accent),22px 0 var(--accent);margin-right:22px}
#q{width:min(280px,55vw);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
#q::placeholder{color:var(--muted)}

.wrap{max-width:1200px;margin:auto;padding:0 20px}
.poster,.hero-card,.screen{background:radial-gradient(circle at var(--x,70%) 30%,hsl(var(--h) 85% 68% / .8) 0,transparent 38%),linear-gradient(165deg,hsl(var(--h) 45% 32%),hsl(calc(var(--h) + 40) 40% 14%))}
.has-img{background:var(--img) center/cover no-repeat,radial-gradient(circle at var(--x,70%) 30%,hsl(var(--h) 85% 68% / .8) 0,transparent 38%),linear-gradient(165deg,hsl(var(--h) 45% 32%),hsl(calc(var(--h) + 40) 40% 14%))}
.hero{margin-top:22px}
.hero-card{border-radius:24px;min-height:360px;padding:clamp(22px,5vw,56px);display:flex;flex-direction:column;justify-content:flex-end;gap:14px;position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(24,25,28,.78),transparent 65%);pointer-events:none}
.hero-card>*{position:relative;z-index:1}
.hero h1{margin:0;font-size:clamp(2.4rem,7vw,4.6rem);line-height:1;letter-spacing:-.03em;font-weight:800;max-width:14ch}
.hero p{margin:0;max-width:52ch;color:#e6e6e3}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.9rem}
.hero .meta{color:#dcdcd8}
.star{color:var(--accent);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 22px;font-weight:600;background:rgba(255,255,255,.16);transition:background .15s}
.btn:hover{background:rgba(255,255,255,.26)}
.btn.main{background:var(--accent);color:var(--accent-ink)}

.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:38px 0 18px}
.head h2{margin:0;font-size:1.6rem}
.chips{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 15px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 18px}
.card{position:relative}
.open{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.poster{aspect-ratio:2/3;border-radius:14px;padding:14px;display:flex;align-items:flex-end;font-weight:700;font-size:1.2rem;line-height:1.1;transition:transform .2s,box-shadow .2s}
.open:hover .poster{transform:translateY(-4px);box-shadow:0 14px 28px #0005}
.card h3{margin:10px 0 2px;font-size:1rem;font-weight:600}
.card .meta{font-size:.82rem}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:#18191c99}
.fav[aria-pressed=true]{color:var(--accent)}
.fav[aria-pressed=true] path,.btn[aria-pressed=true] .heart path{fill:currentColor}
.empty{text-align:center;color:var(--muted);padding:48px 0}
footer{max-width:1200px;margin:56px auto 0;padding:24px 20px 32px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}

.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:#101113cc;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.dlg{position:relative;width:min(900px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:20px;box-shadow:0 30px 80px #0008}
.x{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border:0;border-radius:50%;background:#18191c99;font-size:1.2rem}
.screen{position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}
.screen video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}

/* Legenda maior, inclusive em tela cheia. */
.screen video::cue{
  font-size:180%;
  line-height:1.25;
  background-color:rgba(0,0,0,.78);
  color:#fff;
  text-shadow:0 1px 3px #000;
}
.screen:fullscreen video::cue{
  font-size:200%;
}
.screen video::-webkit-media-text-track-container{transform:translateY(-16px)}

.screen:fullscreen{aspect-ratio:auto;background:#000}
.big{width:76px;height:76px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;z-index:2;transition:opacity .25s ease}
.screen.playing .big{opacity:0}
.screen.playing:hover .big{opacity:1}

/* Aviso/erro aparece em cima do vídeo, para você conseguir ver. */
.status{position:absolute;left:12px;right:60px;top:12px;z-index:4;margin:0;padding:8px 12px;border-radius:10px;background:#000000cc;color:#fff;font-size:.85rem;pointer-events:none}
.status:empty{display:none}
.status a{color:var(--accent);text-decoration:underline;pointer-events:auto}

.ctl{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:10px;padding:26px 16px 12px;background:linear-gradient(transparent,#000a);opacity:1;transition:opacity .25s ease}
.screen.controls-hidden .ctl{opacity:0;pointer-events:none}
.screen.controls-hidden .big{opacity:0!important;pointer-events:none}
.screen.controls-hidden{cursor:none}
.ctl button{border:0;background:none;padding:2px;display:grid}
.track{flex:1;height:8px;border-radius:4px;background:#ffffff47;cursor:pointer;position:relative;min-width:20px;touch-action:none}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:4px;background:var(--accent);pointer-events:none}
.time{font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
#subtitle{max-width:130px;background:#242629;color:white;border:1px solid var(--line);border-radius:8px;padding:5px;font-size:.78rem}
.info{padding:22px 26px 28px;display:grid;gap:10px}
.info h2{margin:0;font-size:1.8rem;padding-right:44px}
.info p{margin:0;max-width:64ch;color:#d9dadc}
.info .btn{background:var(--surface-2);justify-self:start}
.note{font-size:.8rem;color:var(--muted)}

@media(max-width:560px){
.hero-card{min-height:320px}
.info{padding:18px}
.ctl{gap:7px;padding:22px 9px 9px}
.time{font-size:.72rem}
#subtitle{max-width:105px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

function showControls(){

  if(vid&&!vid.paused&&!vid.ended){

}

function keepControlsVisible(){

}

const fmt=s=>{
  s=Math.floor(s||0);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=String(s%60).padStart(2,"0");
  return h?h+":"+String(m).padStart(2,"0")+":"+r:m+":"+r;
};

function ui(){
  // Enquanto o seek está em andamento, não deixe timeupdate restaurar
  // visualmente a posição antiga do vídeo.
  if(vid&&!isSeeking&&pendingSeekTime===null&&Number.isFinite(vid.duration)&&vid.duration>0){
    pos=vid.currentTime/vid.duration;
  }

  $("#fill").style.width=(pos*100)+"%";

  const total=vid&&Number.isFinite(vid.duration)?vid.duration:cur.m*60;
  $("#time").textContent=fmt(pos*total)+" / "+fmt(total);
  $("#mute").innerHTML=vid&&vid.muted?ICON.mute:ICON.vol;
  $("#fs").innerHTML=ICON.fs;

  const ic=playing?ICON.pause:ICON.play;
  $("#big").innerHTML=ic;
  $("#pp").innerHTML=ic.replace(/26/g,"22");
  $("#screen").classList.toggle("playing",playing);
}

// Mostra, em cima do vídeo, por que ele não carregou (código + servidor).
function mostrarErro(v){
  const code=v.error&&v.error.code;
  const detalhe=code===2?"A conexão foi interrompida.":
    code===3?"O navegador não conseguiu decodificar este arquivo (formato ou codec).":
    code===4?"Não achei o vídeo neste endereço, ele está bloqueado ou o formato não é compatível.":
    "O servidor não conseguiu entregar o vídeo.";
  const link=v.currentSrc||v.src||"";
  let host="";
  try{host=new URL(link).hostname}catch(e){}
  $("#status").innerHTML=esc(detalhe)+" (código "+esc(code||"?")+(host?", servidor "+esc(host):"")+")"+
    (/^https?:/i.test(link)?' <a href="'+esc(link)+'" target="_blank" rel="noopener">Abrir o vídeo direto</a>':"");
  console.warn("Erro no vídeo:",cur&&cur.t,"código",code,link);
}

function setPlay(on){
  if(!vid)return;

  if(on){
    const player=vid;
    const p=player.play();
    if(p&&p.catch)p.catch(error=>{
      if(vid!==player)return;
      if(player.error)mostrarErro(player);
      else $("#status").textContent="Não foi possível iniciar a reprodução. Toque em Reproduzir para tentar novamente.";
      console.warn("Falha ao iniciar reprodução:",error);
    });
  }else{
    vid.pause();
  }
}

function fillFav(){
  const f=favs.has(cur.id);
  $("#mf").setAttribute("aria-pressed",f);
  $("#mf").innerHTML=ICON.heart+(f?"Na minha lista":"Adicionar à minha lista");

function toggleFs(){
  const el=$("#screen");

  if(document.fullscreenElement){
    document.exitFullscreen();
  }else if(el.requestFullscreen){
    el.requestFullscreen();
  }else if(vid&&vid.webkitEnterFullscreen){
    // iPhone: só o player nativo entra em tela cheia.
    vid.webkitEnterFullscreen();
  }
}

function openMovie(o){
  cur=o;
  pos=0;
  playing=false;
  isSeeking=false;
  pendingSeekTime=null;
  seekPointerId=null;
  keepControlsVisible();
  lastFocus=document.activeElement;

  const s=$("#screen");
  s.setAttribute("style",sty(o));
  // Desconecta completamente o player anterior antes de criar outro.
  s.querySelectorAll("video").forEach(v=>{
    v.pause();
    v.removeAttribute("src");
    v.querySelectorAll("source,track").forEach(el=>el.remove());
    try{v.load()}catch(e){}
    v.remove();
  });
  vid=null;

  $("#status").textContent="";
  $("#subtitle").hidden=true;
  $("#subtitle").innerHTML='<option value="-1">Legendas: desligadas</option>';

  // Arquivo direto (src, com token se for do seu PC) ou vídeo do Drive via Render.
  const url=o.src?mediaUrl(o.src):(o.driveId&&MEDIA_OK?MEDIA+"/media/"+encodeURIComponent(o.driveId):"");

  if(url){
    const v=document.createElement("video");
    v.src=url;
    v.playsInline=true;
    v.setAttribute("playsinline","");
    v.setAttribute("webkit-playsinline","");
    v.preload="metadata";
    v.controls=false;

    (o.subtitles||[]).forEach((sub,i)=>{
      const tr=document.createElement("track");
      tr.kind="subtitles";
      tr.src=sub.src;
      tr.srclang=sub.lang||"pt";
      tr.label=sub.label||sub.lang||"Legenda";
      if(sub.default)tr.default=true;

      tr.addEventListener("load",()=>{
        try{
          const track=tr.track;
          for(const cue of Array.from(track.cues||[])){
            if(cue.line==="auto"||cue.line===-1)cue.line=-3;
          }
        }catch(e){}
      });

      v.appendChild(tr);

      const op=document.createElement("option");
      op.value=String(i);
      op.textContent=sub.label||"Legenda";
      $("#subtitle").appendChild(op);
    });

    if((o.subtitles||[]).length){
      $("#subtitle").hidden=false;
      const def=(o.subtitles||[]).findIndex(x=>x.default);
      if(def>=0)$("#subtitle").value=String(def);
    }

    v.addEventListener("play",()=>{
      if(vid!==v)return;
      playing=true;
      ui();
      showControls();
    });

    v.addEventListener("pause",()=>{
      if(vid!==v)return;
      playing=false;
      ui();
      keepControlsVisible();
    });

    v.addEventListener("timeupdate",ui);
    v.addEventListener("seeking",()=>{
      if(pendingSeekTime!==null)ui();
    });
    v.addEventListener("seeked",()=>{
      pendingSeekTime=null;
      ui();
    });
    v.addEventListener("durationchange",ui);

    v.addEventListener("loadedmetadata",()=>{
      if(vid!==v)return;
      $("#status").textContent="";
      ui();
    });

    v.addEventListener("error",()=>{
      if(vid!==v)return;
      mostrarErro(v);
    });

    v.addEventListener("waiting",()=>{
      if(vid===v)$("#status").textContent="Carregando vídeo…";
    });
    v.addEventListener("playing",()=>{
      if(vid===v)$("#status").textContent="";
    });
    v.addEventListener("canplay",()=>{
      if(vid===v&&v.paused)$("#status").textContent="Pronto para reproduzir.";
    });

    v.addEventListener("stalled",()=>{
      if(vid===v&&pendingSeekTime!==null){
        $("#status").textContent="Aguardando o servidor entregar o trecho solicitado...";
      }
    });

    v.addEventListener("volumechange",ui);
    v.addEventListener("click",()=>setPlay(v.paused));

    s.prepend(v);
    vid=v;
  }else{
    $("#status").textContent=o.driveId&&!MEDIA_OK
      ?"Este filme depende do servidor do Drive, que não está configurado."
      :"Este filme ainda não está disponível.";
  }

  $("#mt").textContent=o.t;
  $("#mm").innerHTML=meta(o);
  $("#ms").textContent=o.p;
  fillFav();
  ui();

  $("#modal").classList.add("open");
  $("#close").focus();
}

function closeMovie(){
  keepControlsVisible();

  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});

  const old=vid;
  vid=null;
  playing=false;
  isSeeking=false;
  pendingSeekTime=null;
  seekPointerId=null;

  if(old){
    old.pause();
    old.removeAttribute("src");
    old.querySelectorAll("source,track").forEach(el=>el.remove());
    try{old.load()}catch(e){}
    old.remove();
  }

  $("#modal").classList.remove("open");

  if(lastFocus)lastFocus.focus();
}

// Converte a posição horizontal do ponteiro em uma fração de 0 a 1.
function getSeekFraction(e){
  const rect=$("#track").getBoundingClientRect();

  if(!rect.width)return null;

  const fraction=(e.clientX-rect.left)/rect.width;
  return Math.min(1,Math.max(0,fraction));
}

// Durante o arraste, atualiza a prévia visual sem disparar vários seeks.
function previewSeek(fraction){
  if(!vid||!Number.isFinite(vid.duration)||vid.duration<=0)return;

  pos=fraction;
  $("#fill").style.width=(fraction*100)+"%";
  $("#time").textContent=fmt(fraction*vid.duration)+" / "+fmt(vid.duration);
}

// Aplica o seek real quando o usuário solta a barra.
function commitSeek(fraction){
  if(!vid||!Number.isFinite(vid.duration)||vid.duration<=0)return;

  const duration=vid.duration;
  const targetTime=Math.max(0,Math.min(duration,fraction*duration));

  pendingSeekTime=targetTime;
  pos=targetTime/duration;
  $("#fill").style.width=(pos*100)+"%";
  $("#time").textContent=fmt(targetTime)+" / "+fmt(duration);
  $("#status").textContent="";

  try{
    vid.currentTime=targetTime;

    if(Math.abs(vid.currentTime-targetTime)<0.05&&!vid.seeking){
      pendingSeekTime=null;
      ui();
    }
  }catch(error){
    pendingSeekTime=null;
    $("#status").textContent="Não foi possível avançar para esse ponto.";
    console.error("Erro ao posicionar o vídeo:",error);
    ui();
  }
}

// Mouse, toque e caneta: clique e arraste na timeline.
$("#track").addEventListener("pointerdown",e=>{
  if(!vid||!Number.isFinite(vid.duration)||vid.duration<=0)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;

  e.preventDefault();
  showControls();

  isSeeking=true;
  seekPointerId=e.pointerId;

  const fraction=getSeekFraction(e);
  if(fraction!==null)previewSeek(fraction);

  try{
    e.currentTarget.setPointerCapture(e.pointerId);
  }catch(error){}
});

$("#track").addEventListener("pointermove",e=>{
  if(!isSeeking||e.pointerId!==seekPointerId)return;

  const fraction=getSeekFraction(e);
  if(fraction!==null)previewSeek(fraction);
});

$("#track").addEventListener("pointerup",e=>{
  if(!isSeeking||e.pointerId!==seekPointerId)return;

  const fraction=getSeekFraction(e);

  if(fraction!==null){
    previewSeek(fraction);
  }

  isSeeking=false;
  if(fraction!==null)commitSeek(fraction);
  seekPointerId=null;
  showControls();

  try{
    if(e.currentTarget.hasPointerCapture(e.pointerId)){
      e.currentTarget.releasePointerCapture(e.pointerId);
    }
  }catch(error){}
});

$("#track").addEventListener("pointercancel",()=>{
  isSeeking=false;
  seekPointerId=null;
  if(pendingSeekTime===null)ui();
});

$("#screen").addEventListener("pointermove",showControls);
$("#screen").addEventListener("pointerdown",showControls);

$("#screen").addEventListener("pointerleave",()=>{
  if(vid&&!vid.paused&&!vid.ended&&!isSeeking){
    clearTimeout(controlsTimer);

    controlsTimer=setTimeout(()=>{
      $("#screen").classList.add("controls-hidden");
    },CONTROLS_DELAY);
  }
});

$("#big").onclick=$("#pp").onclick=()=>{
  showControls();
  setPlay(!playing);
};

$("#subtitle").addEventListener("change",()=>{
  if(!vid)return;

  const selected=Number($("#subtitle").value);

  Array.from(vid.textTracks).forEach((t,i)=>{
    t.mode=i===selected?"showing":"disabled";
  });
});

$("#mf").onclick=()=>cur&&toggleFav(cur.id);

$("#mute").onclick=()=>{
  showControls();
  if(vid)vid.muted=!vid.muted;
};

$("#fs").onclick=()=>{
  showControls();
  toggleFs();
};

$("#close").onclick=closeMovie;

$("#modal").addEventListener("click",e=>{
  if(e.target.id==="modal")closeMovie();
});

// Teclado: Esc fecha; Espaço/K pausa; setas pulam 10 s; M som; F tela cheia.
document.addEventListener("keydown",e=>{
  if(!$("#modal").classList.contains("open"))return;

  if(e.key==="Escape"){closeMovie();return}
  if(!vid||e.ctrlKey||e.metaKey||e.altKey)return;

  const tag=e.target.tagName;
  if(tag==="SELECT"||tag==="INPUT")return;

  const k=e.key.toLowerCase();

  if(k==="k"||(k===" "&&tag!=="BUTTON")){
    e.preventDefault();
    showControls();
    setPlay(vid.paused);
  }else if(k==="arrowleft"||k==="arrowright"){
    if(!Number.isFinite(vid.duration))return;
    e.preventDefault();
    showControls();
    vid.currentTime=Math.max(0,Math.min(vid.duration,vid.currentTime+(k==="arrowright"?10:-10)));
  }else if(k==="m"){
    showControls();
    vid.muted=!vid.muted;
  }else if(k==="f"){
    showControls();
    toggleFs();
  }
});

/* ===== Lista de filmes pela planilha do Google ===== */
const driveId=u=>{u=String(u||"").trim();const m=u.match(/\/d\/([-\w]+)|[?&]id=([-\w]+)/);return m?(m[1]||m[2]):u};
const hueOf=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};

function parseCSV(t){
  t=t.replace(/^\uFEFF/,"");
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){
      if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}
      else c+=ch;
    }else if(ch==='"')q=true;
    else if(ch===","){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}
    else c+=ch;
  }
  if(c!==""||r.length){r.push(c);rows.push(r)}
  return rows;
}

function filmesDaPlanilha(csv){
  const rows=parseCSV(csv).filter(r=>r.some(c=>c.trim()));
  if(rows.length<2)return [];
  const head=rows[0].map(c=>norm(c.trim()));
  const col=(r,n)=>{const i=head.indexOf(n);return i<0?"":(r[i]||"").trim()};
  return rows.slice(1).map(r=>{
    const t=col(r,"titulo");
    if(!t)return null;
    const cor=col(r,"cor");
    const o={
      t,
      g:col(r,"genero")||"Drama",
      y:+col(r,"ano")||"",
      m:+col(r,"minutos")||100,
      a:col(r,"idade")||"12",
      s:parseFloat(col(r,"nota").replace(",","."))||0,
      h:cor!==""&&!isNaN(+cor)?+cor:hueOf(t),
      x:(20+hueOf(t+"x")%60)+"%",
      p:col(r,"sinopse")
    };
    const capa=col(r,"capa"),leg=col(r,"legenda"),dr=col(r,"drive"),vd=col(r,"video");
    if(capa)o.img=/^https?:/.test(capa)?capa:CAPAS+capa;
    if(dr)o.driveId=driveId(dr);
    if(vd)o.src=/^https:\/\//.test(vd)?vd:"https://"+TS_HOST+"/"+encodeURIComponent(vd);
    if(leg)o.subtitles=[{src:/^https?:/.test(leg)?leg:"legendas/"+leg,lang:"pt-BR",label:"Português"}];
    return o;
  }).filter(Boolean);
}

async function carregarPlanilha(){
  if(!PLANILHA)return;
  try{
    // Aceita o link "pubhtml" e converte para CSV automaticamente.
    let url=PLANILHA.replace("/pubhtml","/pub");
    if(!/output=csv/.test(url))url+=(url.includes("?")?"&":"?")+"output=csv";

    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);

    const lista=filmesDaPlanilha(await r.text());
    if(!lista.length){
      console.warn("A planilha foi lida, mas não tem filmes válidos (confira a linha de títulos das colunas). Usando a lista padrão.");
      return;
    }

    lista.forEach((o,i)=>{o.id=i;o.src=o.src||""});
    M.splice(0,M.length,...lista);
    renderAll();
    console.info("Planilha carregada:",lista.length,"filmes.");
  }catch(e){
    console.warn("Não foi possível ler a planilha; usando a lista padrão.",e);
  }
}

renderAll();
carregarPlanilha();
</script>
